<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        h1 { font-size: 28px; margin-bottom: 5px; }
        .subtitle { font-size: 14px; opacity: 0.9; }
        
        .content {
            padding: 30px;
        }
        
        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            border: 1px solid #ddd;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }
        
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
        }
        
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        @media (max-width: 600px) {
            .form-row { grid-template-columns: 1fr; }
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button.danger {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        button.edit {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            padding: 8px 15px;
            font-size: 12px;
        }
        
        .table-section {
            margin-top: 30px;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        thead {
            background: #f8f9fa;
            border-top: 2px solid #667eea;
            border-bottom: 2px solid #667eea;
        }
        
        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #555;
        }
        
        tr:hover { background: #f9f9f9; }
        
        .action-btns {
            display: flex;
            gap: 10px;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-number {
            font-size: 28px;
            font-weight: bold;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 5px;
        }
        
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }
        
        .empty-state p { font-size: 16px; }
        
        h2 {
            color: #333;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER -->
    <header>
        <h1>📚 Student Management System</h1>
        <div class="subtitle">Add, View, Edit & Delete Student Records</div>
    </header>
    
    <!-- CONTENT -->
    <div class="content">
        
        <!-- STATS -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalStudents">0</div>
                <div class="stat-label">Total Students</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="avgGPA">0.0</div>
                <div class="stat-label">Average GPA</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="classCount">0</div>
                <div class="stat-label">Total Classes</div>
            </div>
        </div>
        
        <!-- ADD STUDENT FORM -->
        <div class="form-section">
            <h2>➕ Add New Student</h2>
            <form id="studentForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Name *</label>
                        <input type="text" id="name" placeholder="e.g., John Doe" required>
                    </div>
                    <div class="form-group">
                        <label>Class *</label>
                        <input type="text" id="class" placeholder="e.g., B.Tech CSE" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Mobile Number *</label>
                        <input type="tel" id="mobile" placeholder="e.g., 9876543210" maxlength="10" required>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="email" placeholder="e.g., john@mail.com">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Place *</label>
                        <input type="text" id="place" placeholder="e.g., Mumbai" required>
                    </div>
                    <div class="form-group">
                        <label>Year of Passout *</label>
                        <input type="number" id="passout" placeholder="e.g., 2026" min="2024" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label>Year of Study (1-6) *</label>
                        <select id="yearOfStudy" required>
                            <option value="">Select Year</option>
                            <option value="1">1st Year</option>
                            <option value="2">2nd Year</option>
                            <option value="3">3rd Year</option>
                            <option value="4">4th Year</option>
                            <option value="5">5th Year</option>
                            <option value="6">6th Year</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>GPA</label>
                        <input type="number" id="gpa" placeholder="e.g., 8.5" min="0" max="10" step="0.1">
                    </div>
                </div>
                
                <button type="submit">Add Student</button>
            </form>
        </div>
        
        <!-- SEARCH & FILTER -->
        <div class="form-section">
            <h2>🔍 Search & Filter</h2>
            <div class="form-row">
                <div class="form-group">
                    <input type="text" id="searchInput" placeholder="Search by name, class, or place...">
                </div>
                <div class="form-group">
                    <button onclick="loadStudents()">Clear Filters</button>
                </div>
            </div>
        </div>
        
        <!-- STUDENTS TABLE -->
        <div class="table-section">
            <h2>📋 Student Records</h2>
            <div id="tableContainer"></div>
        </div>
    </div>
</div>

<script>
// Local Storage Management
const STORAGE_KEY = 'students_data';

// Initialize with sample data if empty
function initializeData() {
    let students = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    
    if (students.length === 0) {
        students = [
            { id: 1, name: 'Arun Kumar', class: 'B.Tech CSE', place: 'Chennai', mobile: '9876543210', year: 3, passout: 2026, email: 'arun@mail.com', gpa: 8.75 },
            { id: 2, name: 'Priya Sharma', class: 'B.Tech ECE', place: 'Delhi', mobile: '9123456780', year: 2, passout: 2027, email: 'priya@mail.com', gpa: 9.10 },
            { id: 3, name: 'Rahul Verma', class: 'BCA', place: 'Mumbai', mobile: '9988776655', year: 4, passout: 2025, email: 'rahul@mail.com', gpa: 7.50 }
        ];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
    }
    return students;
}

// Get all students
function getStudents() {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
}

// Save students
function saveStudents(students) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(students));
}

// Add student
document.getElementById('studentForm').addEventListener('submit', (e) => {
    e.preventDefault();
    
    const students = getStudents();
    const newStudent = {
        id: Date.now(),
        name: document.getElementById('name').value,
        class: document.getElementById('class').value,
        place: document.getElementById('place').value,
        mobile: document.getElementById('mobile').value,
        year: parseInt(document.getElementById('yearOfStudy').value),
        passout: parseInt(document.getElementById('passout').value),
        email: document.getElementById('email').value,
        gpa: parseFloat(document.getElementById('gpa').value) || 0
    };
    
    students.push(newStudent);
    saveStudents(students);
    
    alert('✅ Student added successfully!');
    document.getElementById('studentForm').reset();
    loadStudents();
});

// Load and display students
function loadStudents() {
    const students = getStudents();
    const search = document.getElementById('searchInput').value.toLowerCase();
    
    const filtered = students.filter(s => 
        s.name.toLowerCase().includes(search) ||
        s.class.toLowerCase().includes(search) ||
        s.place.toLowerCase().includes(search)
    );
    
    const container = document.getElementById('tableContainer');
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>No students found. Add one to get started!</p></div>';
        updateStats([]);
        return;
    }
    
    let html = `<table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Class</th>
                <th>Place</th>
                <th>Mobile</th>
                <th>Year</th>
                <th>Passout</th>
                <th>GPA</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>`;
    
    filtered.forEach(student => {
        html += `<tr>
            <td>${student.name}</td>
            <td>${student.class}</td>
            <td>${student.place}</td>
            <td>${student.mobile}</td>
            <td>${student.year}</td>
            <td>${student.passout}</td>
            <td>${student.gpa}</td>
            <td>
                <div class="action-btns">
                    <button class="edit" onclick="editStudent(${student.id})">Edit</button>
                    <button class="danger" onclick="deleteStudent(${student.id})">Delete</button>
                </div>
            </td>
        </tr>`;
    });
    
    html += '</tbody></table>';
    container.innerHTML = html;
    updateStats(students);
}

// Delete student
function deleteStudent(id) {
    if (!confirm('Are you sure you want to delete this student?')) return;
    
    let students = getStudents();
    students = students.filter(s => s.id !== id);
    saveStudents(students);
    
    alert('🗑️ Student deleted successfully!');
    loadStudents();
}

// Edit student (simple version)
function editStudent(id) {
    const students = getStudents();
    const student = students.find(s => s.id === id);
    
    if (!student) return;
    
    document.getElementById('name').value = student.name;
    document.getElementById('class').value = student.class;
    document.getElementById('place').value = student.place;
    document.getElementById('mobile').value = student.mobile;
    document.getElementById('yearOfStudy').value = student.year;
    document.getElementById('passout').value = student.passout;
    document.getElementById('email').value = student.email;
    document.getElementById('gpa').value = student.gpa;
    
    deleteStudent(id);
    document.getElementById('studentForm').scrollIntoView({ behavior: 'smooth' });
}

// Update statistics
function updateStats(students) {
    const total = students.length;
    const avgGPA = total > 0 ? (students.reduce((sum, s) => sum + s.gpa, 0) / total).toFixed(2) : '0.0';
    const classes = new Set(students.map(s => s.class)).size;
    
    document.getElementById('totalStudents').textContent = total;
    document.getElementById('avgGPA').textContent = avgGPA;
    document.getElementById('classCount').textContent = classes;
}

// Search functionality
document.getElementById('searchInput').addEventListener('keyup', loadStudents);

// Initialize
initializeData();
loadStudents();
</script>

</body>
</html>
